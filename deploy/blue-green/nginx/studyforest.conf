map $http_upgrade $connection_upgrade {
    default upgrade;
    ''      close;
}

# upstream 지시문은 http 컨텍스트에 있어야 하므로 server 블록 밖에서 포함한다.
include /etc/nginx/studyforest/active-upstreams.conf;

server {
    listen 443 ssl;
    server_name studyforest.site www.studyforest.site;

    ssl_certificate /etc/letsencrypt/live/studyforest.site/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/studyforest.site/privkey.pem;
    include /etc/letsencrypt/options-ssl-nginx.conf;
    ssl_dhparam /etc/letsencrypt/ssl-dhparams.pem;

    location /api/ {
        proxy_pass http://studyforest_server;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_connect_timeout 5s;
        proxy_read_timeout 60s;
    }

    location /ws-studyspace {
        proxy_pass http://studyforest_server;
        proxy_http_version 1.1;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection $connection_upgrade;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_read_timeout 3600s;
        proxy_send_timeout 3600s;
    }

    location / {
        proxy_pass http://studyforest_client;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}

server {
    listen 80;
    server_name studyforest.site www.studyforest.site;
    return 301 https://$host$request_uri;
}
