spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: studyforest-server
  jackson:
    default-property-inclusion: non_null

  datasource:
    hikari:
      pool-name: StudyForestHikariPool

      # Oracle 커넥션 과점유 방지
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

      # 풀 대기 / 유휴 / 수명 설정
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}
      max-lifetime: ${DB_MAX_LIFETIME_MS:1740000}
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:120000}

      # 커넥션 누수 의심 로그
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:60000}

      data-source-properties:
        oracle.jdbc.defaultConnectionValidation: LOCAL
        oracle.jdbc.implicitStatementCacheSize: 10

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  web:
    locale: ko_KR
    locale-resolver: fixed
  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

jwt:
  secret: ${JWT_SECRET}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
    connect-timeout-ms: ${AI_SERVER_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_SERVER_READ_TIMEOUT_MS:35000}

studyspace:
  realtime:
    # 좌석 선점 락 유지 시간(빠른 실패용). 착석 확정까지의 짧은 창.
    hold-ttl: 8s
    # 접속 생존(presence) 캐시 TTL. heartbeat 주기(20~30s)보다 넉넉히.
    presence-ttl: 60s
    # 연결 끊김 후 재접속 허용 시간. 초과 시 자동 퇴실.
    reconnect-window: 10m
    # presenceSweep가 heartbeat 유실을 끊김으로 판정하는 임계.
    presence-stale-threshold: 90s
    # 일시정지 자동 종료 한도.
    pause-timeout: 1h
    # heartbeat마다 DB last_seen_at 쓰기를 억제하는 최소 간격.
    db-last-seen-throttle: 60s
    # 서버 재기동 후 기존 점유에 부여하는 유예(첫 heartbeat 대기).
    startup-grace: 30s
    # 유지보수 스케줄러 실행 주기.
    sweep-interval: 30s
