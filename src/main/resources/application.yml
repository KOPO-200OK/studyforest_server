spring:
  config:
    import: optional:file:.env[.properties]

  application:
    name: studyforest-server

  jackson:
    default-property-inclusion: non_null

  datasource:
    hikari:
      pool-name: StudyForestHikariPool
      connection-init-sql: ALTER SESSION SET TIME_ZONE = 'Asia/Seoul'

      # Oracle 커넥션 과점유 방지
      maximum-pool-size: ${DB_POOL_MAX_SIZE:5}
      minimum-idle: ${DB_POOL_MIN_IDLE:1}

      # 풀 대기 시간
      connection-timeout: ${DB_CONNECTION_TIMEOUT_MS:10000}

      # 커넥션 유효성 검사 제한 시간
      validation-timeout: ${DB_VALIDATION_TIMEOUT_MS:5000}

      # 사용되지 않는 커넥션 유지 시간
      idle-timeout: ${DB_IDLE_TIMEOUT_MS:300000}

      # 커넥션 최대 수명
      max-lifetime: ${DB_MAX_LIFETIME_MS:1740000}

      # 유휴 커넥션 생존 확인 주기
      keepalive-time: ${DB_KEEPALIVE_TIME_MS:120000}

      # 커넥션 누수 의심 로그 출력 기준
      leak-detection-threshold: ${DB_LEAK_DETECTION_MS:60000}

      data-source-properties:
        oracle.jdbc.defaultConnectionValidation: LOCAL
        oracle.jdbc.implicitStatementCacheSize: 10

  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false

  web:
    locale: ko_KR
    locale-resolver: fixed

  data:
    redis:
      host: ${REDIS_HOST:localhost}
      port: ${REDIS_PORT:6379}

server:
  # REST API와 WebSocket이 공통으로 사용할 Spring Boot 포트
  port: ${SERVER_PORT:8080}

  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

jwt:
  secret: ${JWT_SECRET}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
    connect-timeout-ms: ${AI_SERVER_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_SERVER_READ_TIMEOUT_MS:35000}

studyspace:
  realtime:
    # 좌석 선점 락 유지 시간
    hold-ttl: 8s

    # heartbeat 기반 접속 생존 캐시 TTL
    presence-ttl: 60s

    # 연결이 끊어진 후 재접속을 허용하는 시간
    reconnect-window: 10m

    # heartbeat 유실을 연결 끊김으로 판단하는 기준
    presence-stale-threshold: 90s

    # 일시정지 상태 자동 종료 시간
    pause-timeout: 1h

    # heartbeat마다 DB를 갱신하지 않도록 제한하는 시간
    db-last-seen-throttle: 60s

    # 서버 재시작 후 기존 좌석 점유에 부여하는 유예 시간
    startup-grace: 30s

    # 좌석 상태 정리 스케줄러 실행 주기
    sweep-interval: 30s

  retention:
    # 매주 월요일 오전 3시 30분 지난 학습 세션 정리
    cleanup-cron: "0 30 3 * * MON"

---
# Oracle Cloud 프로필
spring:
  config:
    activate:
      on-profile: cloud

  datasource:
    url: ${CLOUD_DB_URL}
    username: ${CLOUD_DB_USERNAME}
    password: ${CLOUD_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

    hikari:
      data-source-properties:
        oracle.net.tns_admin: ${ORACLE_WALLET_LOCATION}

---
# 학교 또는 내부 Oracle DB 프로필
spring:
  config:
    activate:
      on-profile: univ

  datasource:
    url: ${UNIV_DB_URL}
    username: ${UNIV_DB_USERNAME}
    password: ${UNIV_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver

---
# 테스트 Oracle DB 프로필
spring:
  config:
    activate:
      on-profile: test

  datasource:
    url: ${TEST_DB_URL}
    username: ${TEST_DB_USERNAME}
    password: ${TEST_DB_PASSWORD}
    driver-class-name: oracle.jdbc.OracleDriver