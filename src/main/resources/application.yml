spring:
  config:
    import: optional:file:.env[.properties]
  application:
    name: studyforest-server
  jackson:
    default-property-inclusion: non_null
  jpa:
    hibernate:
      ddl-auto: none
    open-in-view: false
  web:
    locale: ko_KR
    locale-resolver: fixed

server:
  servlet:
    encoding:
      charset: UTF-8
      enabled: true
      force: true

jwt:
  secret: ${JWT_SECRET}

ai:
  server:
    base-url: ${AI_SERVER_BASE_URL:http://127.0.0.1:8000}
    connect-timeout-ms: ${AI_SERVER_CONNECT_TIMEOUT_MS:3000}
    read-timeout-ms: ${AI_SERVER_READ_TIMEOUT_MS:35000}
